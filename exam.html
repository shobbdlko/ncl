<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCL Exam Portal — UP Police</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- SweetAlert CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>
    <!-- SheetJS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0b1526;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .police-card {
            background: rgba(19, 32, 56, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 150, 47, 0.35);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 30px rgba(127, 231, 222, 0.05);
        }

        .eyebrow-text {
            color: #c9962f;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .exam-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .exam-grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        .option-item {
            background: rgba(11, 21, 38, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .option-item:hover {
            border-color: #7fe7de;
            background: rgba(127, 231, 222, 0.05);
        }

        .question-palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(11, 21, 38, 0.8);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-gold {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #c9962f, #9a6f1a);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-slate {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .certificate-box {
            border: 4px double #c9962f;
            padding: 30px;
            border-radius: 16px;
            background: rgba(11, 21, 38, 0.95);
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(201, 150, 47, 0.2);
        }

        .cert-actions-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .hidden { display: none !important; }

         @media print {
            body { 
                background: white !important; 
                color: black !important; 
                margin: 0 !important;
                padding: 0 !important;
                display: flex !important;
                justify-content: center !important;
                align-items: flex-start !important;
                min-height: 100vh !important;
            }
            .no-print { 
                display: none !important; 
            }
            #resultScreen, #resultScreen * { 
                visibility: visible !important; 
            }
            #resultScreen {
                position: relative !important;
                left: auto !important;
                top: auto !important;
                width: 100% !important;
                max-width: 650px !important;
                margin: 20px auto 0 auto !important;
                padding: 0 !important;
                background: white !important;
                color: black !important;
                box-shadow: none !important;
            }
            .certificate-box {
                border: 4px double #000 !important;
                background: white !important;
                color: black !important;
                margin: 0 auto !important;
                box-shadow: none !important;
            }
            .certificate-box h1, .certificate-box h3 { 
                color: black !important; 
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
        }

    </style>
</head>
<body>

    <div class="main-container">

        <!-- 1. परीक्षा स्क्रीन -->
        <div id="examScreen" class="exam-grid">
            <!-- बाईं ओर: प्रश्न -->
            <div class="police-card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <!-- हेडर जिसमें यूजर का नाम, आईडी व यूनिट दिखेगी -->
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px;">
                        <div>
                            <h4 id="profileName" style="color: #ffffff; font-size: 1rem; font-weight: 600;">नाम: -</h4>
                            <p id="profileMeta" style="color: #94a3b8; font-size: 0.8rem;">आईडी: - | यूनिट: -</p>
                        </div>
                        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;">
                            <i class="fa-regular fa-clock"></i> <span id="hours">00</span>:<span id="minutes">59</span>:<span id="seconds">59</span>
                        </div>
                    </div>

                    <!-- प्रश्न पाठ -->
                    <div id="questionText" style="font-size: 1.1rem; font-weight: 600; color: #ffffff; margin-bottom: 20px; line-height: 1.5;">प्रश्न लोड हो रहे हैं...</div>

                    <!-- विकल्प लिस्ट -->
                    <div id="optionsContainer">
                        <div onclick="selectOption('A')" class="option-item">
                            <input type="radio" name="secureAnswer" id="radioA" value="">
                            <span id="textA" style="font-size: 0.95rem;"></span>
                        </div>
                        <div onclick="selectOption('B')" class="option-item">
                            <input type="radio" name="secureAnswer" id="radioB" value="">
                            <span id="textB" style="font-size: 0.95rem;"></span>
                        </div>
                        <div onclick="selectOption('C')" class="option-item">
                            <input type="radio" name="secureAnswer" id="radioC" value="">
                            <span id="textC" style="font-size: 0.95rem;"></span>
                        </div>
                        <div onclick="selectOption('D')" class="option-item">
                            <input type="radio" name="secureAnswer" id="radioD" value="">
                            <span id="textD" style="font-size: 0.95rem;"></span>
                        </div>
                    </div>
                </div>

                <!-- नेविगेशन Buttons -->
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 20px; padding-top: 12px;">
                    <button id="previousButton" onclick="previousQuestion()" class="btn-slate"><i class="fa-solid fa-arrow-left"></i> पिछला</button>
                    <button onclick="removeAnswer()" class="btn-slate" style="color: #f59e0b; border-color: rgba(245, 158, 11, 0.3);">उत्तर हटाएं</button>
                    <button id="nextButton" onclick="nextQuestion()" class="btn-gold" style="width: auto;">अगला <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- दाहिनी ओर: पैलेट -->
            <div class="police-card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h3 class="eyebrow-text" style="font-size: 0.85rem; margin-bottom: 12px; text-align: left;">प्रश्नों की स्थिति पैलेट</h3>
                    <div id="questionGrid" class="question-palette-grid"></div>
                </div>

                <div style="margin-top: 20px;">
                    <button onclick="confirmFinishTest()" class="btn-gold" style="background: linear-gradient(135deg, #dc2626, #991b1b);">
                        <i class="fa-solid fa-flag-checkered"></i> परीक्षा समाप्त करें
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. रिजल्ट व सर्टिफिकेट स्क्रीन -->
        <div id="resultScreen" class="hidden police-card" style="max-width: 650px; margin: 0 auto; text-align: center;">
            <div class="certificate-box">
                <div class="eyebrow-text">UTTAR PRADESH POLICE</div>
                <h1 style="color: #c9962f; font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; margin: 8px 0;">CERTIFICATE OF COMPLETION</h1>
                <p style="color: #94a3b8; font-size: 0.85rem;">यह प्रमाणित किया जाता है कि</p>
                <h3 id="certUser" style="color: #ffffff; font-size: 1.5rem; margin: 10px 0; font-weight: 700;"></h3>
                <p style="color: #e2e8f0; font-size: 0.9rem; margin-bottom: 16px;">द्वारा ऑनलाइन NCL परीक्षा में सफलतापूर्वक भाग लिया गया।</p>
                
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px;">
                    कुल प्रश्न: <span id="certTotal"></span> | सही उत्तर: <span id="certScore" style="color: #7fe7de;"></span> | प्रतिशत: <span id="certPercent" style="color: #c9962f;"></span>%
                </div>

                <div style="font-size: 0.75rem; color: #64748b; display: flex; justify-content: space-between;">
                    <span>दिनांक: <span id="certDate"></span></span>
                    <span>VERIFIED DIGITAL CERTIFICATE</span>
                </div>
            </div>

            <div class="cert-actions-container no-print">
                <button onclick="window.print()" class="btn-gold" style="width: auto;">
                    <i class="fa-solid fa-print"></i> प्रिंट / PDF सेव करें
                </button>
                <button onclick="window.location.href='index.html'" class="btn-slate">लॉगिन पेज पर वापस जाएँ</button>
            </div>
        </div>

    </div>
       <!-- JavaScript Logic -->
    <script>
        'use strict';
        
        let currentUserObj = null;
        let questionsData = [];
        let currentIndex = 0;
        let userAnswers = {};
        let totalSeconds = 3600;
        let timerInterval = null;

        const QUESTIONS_API_URL = "https://script.google.com/macros/s/AKfycbyDzS3NqtINc16q-QlPfYiMtzUZn29QhD8KuuAZmLo5eRpDfas7x93B8rYHAJf-j7fs/exec"; 

        async function initExamPortal() {
            let savedUser = localStorage.getItem('active_exam_user');
            if (!savedUser) {
                window.location.href = "index.html";
                return;
            }

            currentUserObj = JSON.parse(savedUser);
            document.getElementById('profileName').textContent = currentUserObj.name + " (" + currentUserObj.rank + ")";
            document.getElementById('profileMeta').textContent = "आईडी: " + currentUserObj.id + " | यूनिट: " + currentUserObj.unit;

            // तुरंत प्रश्न लोड करें (कैशे या नेटवर्क से)
            await loadQuestionsFromSheet();
            buildQuestionButtons();
            if(questionsData.length > 0) {
                renderQuestion(0);
            }
            timerInterval = setInterval(updateCountdown, 1000);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // सुपर-फास्ट और ऑप्टिमाइज्ड प्रश्न लोडिंग फंक्शन
        async function loadQuestionsFromSheet() {
            try {
                // 1. सबसे पहले सेशन स्टोरेज (Session Cache) चेक करें - इससे स्पीड कई गुना बढ़ जाती है
                let cachedQuestions = sessionStorage.getItem('cached_cctns_questions');
                if (cachedQuestions) {
                    let allQuestions = JSON.parse(cachedQuestions);
                    processAndSetQuestions(allQuestions);
                    return;
                }

                // 2. यदि कैशे नहीं है, तो तुरंत फेच करें और बैकग्राउंड में सेव करें
                let response = await fetch(QUESTIONS_API_URL, {
                    method: "GET",
                    redirect: "follow"
                });

                if (!response.ok) throw new Error("प्रश्न फ़ेच करने में विफलता");

                let data = await response.json();
                let allQuestions = data.questions || (Array.isArray(data) ? data : []);

                if (Array.isArray(allQuestions) && allQuestions.length > 0) {
                    sessionStorage.setItem('cached_cctns_questions', JSON.stringify(allQuestions));
                    processAndSetQuestions(allQuestions);
                } else {
                    throw new Error("शीट खाली है या प्रश्न नहीं मिले");
                }
            } catch (error) {
                console.error("Error loading questions:", error);
                questionsData = [
                    { DisplayNumber: 1, Question: "कोर्ट ट्रायल विवरण हेतु कौन सा फॉर्म उपयोग किया जाता है?", OptionA: "IIF-2", OptionB: "IIF-3", OptionC: "IIF-6", OptionD: "उपरोक्त सभी", CorrectAnswer: "IIF-6" }
                ];
            }
        }

        function processAndSetQuestions(allQuestions) {
            let clonedArray = JSON.parse(JSON.stringify(allQuestions));
            shuffleArray(clonedArray);
            
            let selectCount = Math.min(clonedArray.length, 100);
            questionsData = clonedArray.slice(0, selectCount).map((q, index) => ({
                DisplayNumber: index + 1,
                Question: q.Question || "",
                OptionA: q.OptionA || "",
                OptionB: q.OptionB || "",
                OptionC: q.OptionC || "",
                OptionD: q.OptionD || "",
                CorrectAnswer: q.CorrectAnswer || ""
            }));
        }

        function buildQuestionButtons() {
            let grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            for (let i = 0; i < questionsData.length; i++) {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.id = 'questionButton' + (i + 1);
                btn.style.cssText = "padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;";
                btn.textContent = (i + 1);
                btn.setAttribute('data-index', i);
                btn.onclick = function() {
                    jumpQuestion(parseInt(this.getAttribute('data-index'), 10));
                };
                grid.appendChild(btn);
            }
        }

        function renderQuestion(index) {
            currentIndex = index;
            let q = questionsData[index];
            
            document.getElementById('questionText').textContent = 'प्रश्न ' + q.DisplayNumber + ': ' + q.Question;
            
            document.getElementById('textA').textContent = q.OptionA;
            document.getElementById('textB').textContent = q.OptionB;
            document.getElementById('textC').textContent = q.OptionC;
            document.getElementById('textD').textContent = q.OptionD;

            document.getElementById('radioA').value = q.OptionA;
            document.getElementById('radioB').value = q.OptionB;
            document.getElementById('radioC').value = q.OptionC;
            document.getElementById('radioD').value = q.OptionD;

            let radios = document.getElementsByName('secureAnswer');
            let selectedValue = userAnswers[q.DisplayNumber] || null;
            
            for (let i = 0; i < radios.length; i++) {
                radios[i].checked = (radios[i].value === selectedValue);
            }

            document.getElementById('previousButton').disabled = (index <= 0);
            document.getElementById('nextButton').disabled = (index >= questionsData.length - 1);
            updateGridStyles();
        }

        function selectOption(choiceKey) {
            let q = questionsData[currentIndex];
            let selectedText = "";
            
            if (choiceKey === 'A') selectedText = q.OptionA;
            else if (choiceKey === 'B') selectedText = q.OptionB;
            else if (choiceKey === 'C') selectedText = q.OptionC;
            else if (choiceKey === 'D') selectedText = q.OptionD;

            document.getElementById('radio' + choiceKey).checked = true;
            userAnswers[q.DisplayNumber] = selectedText;
            updateGridStyles();
        }

        function removeAnswer() {
            let q = questionsData[currentIndex];
            delete userAnswers[q.DisplayNumber];
            
            let radios = document.getElementsByName('secureAnswer');
            for (let i = 0; i < radios.length; i++) radios[i].checked = false;
            updateGridStyles();
        }

        function updateGridStyles() {
            for (let i = 1; i <= questionsData.length; i++) {
                let btn = document.getElementById('questionButton' + i);
                if (btn) {
                    let isAns = userAnswers[i] !== undefined;
                    if (i === questionsData[currentIndex].DisplayNumber) {
                        btn.style.background = "#c9962f";
                        btn.style.color = "#000";
                        btn.style.borderColor = "#7fe7de";
                    } else if (isAns) {
                        btn.style.background = "#10b981";
                        btn.style.color = "#fff";
                        btn.style.borderColor = "#059669";
                    } else {
                        btn.style.background = "rgba(255,255,255,0.08)";
                        btn.style.color = "#fff";
                        btn.style.borderColor = "rgba(255,255,255,0.1)";
                    }
                }
            }
        }

        function previousQuestion() {
            if (currentIndex > 0) renderQuestion(currentIndex - 1);
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) renderQuestion(currentIndex + 1);
        }

        function jumpQuestion(index) {
            renderQuestion(index);
        }

        function confirmFinishTest() {
            swal({
                title: 'परीक्षा समाप्त करें?',
                text: 'क्या आप वाकई अपने उत्तर जमा करना चाहते हैं?',
                type: 'warning',
                showCancelButton: true,
                confirmButtonText: 'हाँ, सबमिट करें',
                cancelButtonText: 'जारी रखें'
            }, function(confirmed) {
                if (confirmed) submitExam();
            });
        }

        async function submitExam() {
            clearInterval(timerInterval);
            
            let score = 0;
            let total = questionsData.length;
            
            for (let i = 0; i < total; i++) {
                let q = questionsData[i];
                let userChoiceText = userAnswers[q.DisplayNumber] || "";
                
                if (userChoiceText.trim() !== "" && userChoiceText.trim() === q.CorrectAnswer.trim()) {
                    score++;
                }
            }
            
            let percentage = total > 0 ? ((score / total) * 100).toFixed(2) : "0.00";
            let finalMarksText = score + " / " + total + " (" + percentage + "%)";

            try {
                let scoreApiUrl = QUESTIONS_API_URL + "?action=saveScore&id=" + encodeURIComponent(currentUserObj.id) + "&score=" + encodeURIComponent(finalMarksText);
                await fetch(scoreApiUrl, { method: "GET", redirect: "follow" });
            } catch (err) {
                console.error("Score update error:", err);
            }

            document.getElementById('certUser').textContent = currentUserObj.name + " (" + currentUserObj.rank + ", " + currentUserObj.unit + ")";
            document.getElementById('certTotal').textContent = total;
            document.getElementById('certScore').textContent = score;
            document.getElementById('certPercent').textContent = percentage;
            document.getElementById('certDate').textContent = new Date().toLocaleDateString('hi-IN');

            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function updateCountdown() {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                swal("समय समाप्त", "परीक्षा का समय समाप्त हो गया है।", "info");
                setTimeout(submitExam, 1500);
                return;
            }
            totalSeconds--;
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            document.getElementById('hours').textContent = h < 10 ? '0' + h : h;
            document.getElementById('minutes').textContent = m < 10 ? '0' + m : m;
            document.getElementById('seconds').textContent = s < 10 ? '0' + s : s;
        }

        initExamPortal();
    </script>
    </script>
</body>
</html>
